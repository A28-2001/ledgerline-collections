# Collections check: configuration for Ledgerline's data room (as of 2026-10-31).
# The made-up sample data uses pipeline/config.sample.yaml instead:
#   COLLECTIONS_CONFIG=pipeline/config.sample.yaml .venv/bin/python pipeline/run.py --data sample
#
# Column names were suggested by pipeline/profile_data.py and checked by hand.
# Policy numbers come from docs/collections_policy.md, docs/sla_policy.md and docs/process_maps.md.

company_name: Ledgerline
as_of: "2026-10-31"            # the data room's "today"
currency: USD
overdue_source: ar_aging       # the QuickBooks AR aging export finance works from

files:
  customers:
    file: customers.csv
    cols: {id: customer_id, name: name, segment: plan, plan: plan, arr: current_arr, account_manager: account_manager,
           renewal_date: renewal_date, billing_email: null, status: status, payment_method: payment_method}
  contacts:
    file: contacts.csv
    cols: {id: contact_id, customer_id: customer_id, name: null, first_name: first_name, last_name: last_name,
           email: email, role: role, last_active: null, status: status}
  contracts:
    file: contracts.csv
    cols: {id: null, customer_id: customer_id, start: term_start, end: term_end, seats: seats,
           unit_price: price_per_seat_per_month, status: null, contract_arr: arr, platform_fee: platform_fee}
  invoices:
    file: invoices.csv
    cols: {id: invoice_id, customer_id: customer_id, customer_name: customer_name, issue_date: issue_date,
           due_date: due_date, amount: amount, status: status, paid_date: paid_date, method: payment_method,
           seats: null, unit_price: null, period_months: service_period_months, type: type}
  payments:
    file: payments.csv
    cols: {id: payment_id, invoice_id: invoice_id, payer: payer_name, amount: amount, date: received_date,
           method: method, status: null, memo: memo, applied_date: applied_date}
  ar_aging:
    file: ar_aging.csv
    cols: {invoice_id: invoice_id, customer_id: customer_id, customer_name: customer_name, issue_date: issue_date,
           due_date: due_date, amount: amount, days_overdue: days_past_due, status: status}
  tickets:
    file: tickets.csv
    cols: {id: ticket_id, customer_id: customer_id, customer_name: customer_name, created: created_at, status: status,
           priority: priority, category: category, subject: subject, body: body, resolved: resolved_at}

values:
  invoice_open_status: [open, overdue, payment_failed]
  invoice_void_status: [void, voided, cancelled, canceled, written_off]
  invoice_failed_status: [payment_failed]
  payment_failed_status: [failed, declined, returned, bounced]
  ticket_closed_status: [solved, closed, resolved]
  ticket_serious_priority: [urgent]
  ticket_open_status: [open, pending, new, on-hold, hold]
  ticket_billing_category: [billing, account change]
  ticket_question_category: [how-to]
  contact_left_status: left the firm

# Every rule cites where it comes from. collections_policy.md has no numbered sections,
# so refs name the rule.
policy:
  doc: collections_policy.md
  reminders:
    - {from_days: 7, stage: "First reminder (7 days)", ref: "collections_policy.md: reminders at 7, 21 and 45 days"}
    - {from_days: 21, stage: "Second reminder (21 days)", ref: "collections_policy.md: reminders at 7, 21 and 45 days"}
  call_after_days: 45            # the 45-day template threatens suspension, which needs VP Finance sign-off: a person calls instead
  call_amount: 1000000000        # no amount threshold in the policy; large accounts are covered by the top-50 rule
  call_ref: "process_maps.md FIN-1: not paid after the reminders, phone and offer a payment plan"
  escalate_after_days: 90
  escalate_ref: "process_maps.md FIN-1: still unpaid at 90 days, escalate to the VP Finance"
  hold_business_days: 5          # Maya: five working days (VP Finance to confirm)
  dispute_fix_days: 5            # Maya: corrected invoice or clear answer within five working days
  am_pause_days: 3               # Maya: account manager gets 3 working days on an open-ticket pause
  paid_match_days: 2             # Maya: Marcus matches probably-paid bills within 2 working days
  credit_self_approve_max: 2500  # Maya: Priya corrects up to about $2,500; Dana above that or any top-50 account (Dana may change it)
  write_off_flag_working_days: 5 # Maya: flag Dana at least five working days before an automatic write-off
  hold_ref: "collections_policy.md: don't chase a dispute or open escalation until the account manager says so"
  card_ref: "billing_engine_rewrite_2026.md: Stripe retries failed cards three times over seven days, emailing each time"
  card_writeoff_days: 150
  card_writeoff_ref: "collections_policy.md: card invoices unpaid after 150 days are written off automatically"
  top_accounts: 50
  top_ref: "collections_policy.md: nothing goes to one of the 50 largest accounts without a person reading it first"
  sensitive_ref: "sla_policy.md: legal action, regulator, chargeback or cancellation goes to the Head of Support"
  complaint_lookback_days: 30
  grave_lookback_days: 180       # a chargeback, regulator or legal threat stays live this long unless someone confirms it is settled
  paid_match_tolerance: 0.01
  paid_match_window_days: 60
  recent_payment_days: 21       # payments.csv: matching can lag up to ~3 weeks (wire/cheque); Maya: Paidly chased a paid customer
  wrong_bill_tolerance: 0.02
  stale_contact_days: 180

matching:
  fuzzy_high: 92
  fuzzy_low: 80
  min_gap: 4

ai:
  judges: [openai/gpt-oss-20b, qwen/qwen3.8-27b]
  drafter: openai/gpt-oss-120b
  params:
    openai/gpt-oss-20b: {reasoning_effort: low}
    openai/gpt-oss-120b: {reasoning_effort: low}
  max_tokens: 300
  # sla_policy.md: ticket content must not go to a new vendor without a data processing agreement.
  # Maya (23 Nov): no AI provider is approved; run on rules until legal signs off.
  #   off      = no vendor. Ticket tags and status, plus simple rules run locally on the text (nothing leaves
  #              Ledgerline's systems). Billing-tagged tickets the rules don't read as disputes go to a person.
  #   redacted = AI judges read redacted ticket text (switch on only once legal approves the provider).
  ticket_text: "off"

# Maya's trust ladder (23 Nov). Auto-send is OFF and stays off until days_on_record of Priya's approvals exist.
auto_send:
  days_on_record: 30
  max_days: 45          # first or second reminder only (policy: reminders at 7 and 21 days)
  max_amount: 5000      # Maya: start at under $5,000; Priya can change it in the app (start tight, loosen later)

# How the data gets in (Maya, 24 Nov): read-only service accounts, not a morning export.
# The export folder stays as the fallback when a connection breaks. This run used the fallback.
sources:
  - {name: QuickBooks Online, what: "AR aging, invoices, payments applied", how: "Read-only service account", signOff: "VP Finance (Dana Ruiz)", status: "Planned. This run: fallback export"}
  - {name: Zendesk, what: "Tickets from customers with an overdue bill; finance sees masked excerpts only", how: "Read-only service account", signOff: "Head of Support sets it up; COO signs off", status: "Planned. This run: fallback export"}
  - {name: Stripe and bank receipts, what: "Unmatched payments", how: "Read-only (Stripe is a finance tool already)", signOff: "VP Finance", status: "Planned. This run: fallback export"}
  - {name: Export upload, what: "Same files, dropped in by hand", how: "Fallback if a connection breaks", signOff: "None needed", status: "In use for this run (data room files)"}

# Maya (24 Nov): while Priya is on leave in March, Dana owns the morning list and Marcus keeps the
# probably-paid list. Set on_leave: true for those weeks. (Maya to confirm Dana's twenty minutes a day.)
leave_cover:
  person: Priya Nair
  when: March (dates to confirm)
  cover: Dana Ruiz
  paid_cover: Marcus Bell
  on_leave: false

trend_markers:
  - {month: "2026-03", label: Billing engine rewrite (16 Mar)}

people:
  finance_owner: Priya Nair (AR Specialist)
  billing_owner: Ana Duarte (Billing Support Specialist)
  vp_finance: Dana Ruiz (VP Finance)
  cash_owner: Marcus Bell (Staff Accountant)

# Memory between mornings: drop each day's decision list (the CSV from the Today page) here.
history_dir: data/history
